openapi: 3.1.0
info:
  title: QD Wallet API
  version: 1.0.0-draft
  description: |
    Non-custodial wallet backend. The API never receives recovery phrases, seeds,
    private keys, vault passwords, PINs or client key shares. See
    docs/architecture/qd-wallet-v1-technical-spec.md §9.5.

    ## Encoding conventions
    - Binary values (keys, nonces, signatures) are **base64url without padding**.
    - Amounts are **decimal strings in base units** (wei, piconero). Never numbers.
    - Timestamps are RFC 3339 UTC strings.
    - Errors are RFC 9457 `application/problem+json` with a stable `code`.

    ## Authentication (spec §22)
    1. Client creates a P-256 device key (WebCrypto non-extractable / Secure Enclave).
    2. `POST /v1/auth/challenge` with the SPKI public key → server returns `message`.
    3. Client signs the UTF-8 bytes of `message` with ECDSA P-256 / SHA-256.
       Signature format: IEEE P1363 (`r || s`, 64 bytes), base64url.
    4. `POST /v1/auth/register` (new device) or `/v1/auth/login` (known device).

    `message` format (server-built, client MUST check prefix and origin before signing):
    `QDWallet-Auth|v1|{origin}|{challengeId}|{nonce}|{issuedAt}`
    Challenges are single-use and expire after 60 seconds.

    ## Session transport
    - **Web** (request header `X-QD-Client: web`): server sets cookies
      `__Host-qd_at` (access, 10 min), `__Host-qd_rt` (refresh, 30 d, Path=/),
      both `HttpOnly; Secure; SameSite=Strict`. The response body contains
      `csrfToken` but **no tokens**. Every unsafe request (POST/PUT/PATCH/DELETE)
      authenticated by cookie MUST send header `X-CSRF-Token: {csrfToken}`; the
      server compares it (constant time) with the HMAC bound to the session.
    - **Mobile** (`X-QD-Client: mobile`): body contains `accessToken` and
      `refreshToken`; requests use `Authorization: Bearer {accessToken}`;
      refresh sends `{ "refreshToken": "..." }` in the body.
    Refresh tokens rotate on every use. Reuse of a rotated token revokes the whole
    token family and records a `refresh_token_reuse` security event.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: auth
  - name: devices
  - name: wallets
  - name: chain
  - name: transactions
  - name: security
  - name: public
  - name: shared-wallets
paths:
  /v1/auth/challenge:
    post:
      tags: [auth]
      operationId: createChallenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [devicePublicKey]
              properties:
                devicePublicKey: { type: string, description: "base64url SPKI DER, P-256" }
      responses:
        "200":
          description: Challenge issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Challenge" }
        "400": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /v1/auth/register:
    post:
      tags: [auth]
      operationId: register
      description: Registers a new device and a new user. Fails with 409 DEVICE_EXISTS if the key is known.
      parameters: [{ $ref: "#/components/parameters/ClientType" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId, signature, platform]
              properties:
                challengeId: { type: string }
                signature: { type: string }
                platform: { type: string, enum: [web, ios, android] }
                label: { type: string, maxLength: 64 }
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      parameters: [{ $ref: "#/components/parameters/ClientType" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId, signature]
              properties:
                challengeId: { type: string }
                signature: { type: string }
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      parameters: [{ $ref: "#/components/parameters/ClientType" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string, description: "Mobile only" }
      responses:
        "200":
          description: Rotated session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Problem" }
  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "204": { description: Session revoked }
  /v1/me:
    get:
      tags: [auth]
      operationId: me
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Current principal
          content:
            application/json:
              schema:
                type: object
                required: [userId, deviceId]
                properties:
                  userId: { type: string, format: uuid }
                  deviceId: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Problem" }

  /v1/devices:
    get:
      tags: [devices]
      operationId: listDevices
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Devices
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices: { type: array, items: { $ref: "#/components/schemas/Device" } }
  /v1/devices/{deviceId}:
    parameters:
      - { name: deviceId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [devices]
      operationId: renameDevice
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties: { label: { type: string, maxLength: 64 } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Device" } } } }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [devices]
      operationId: revokeDevice
      description: Revokes the device and all its sessions.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/Problem" }

  /v1/wallets:
    get:
      tags: [wallets]
      operationId: listWallets
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Wallets with accounts
          content:
            application/json:
              schema:
                type: object
                required: [wallets]
                properties:
                  wallets: { type: array, items: { $ref: "#/components/schemas/Wallet" } }
    post:
      tags: [wallets]
      operationId: createWallet
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties: { label: { type: string, maxLength: 64 } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Wallet" } } } }
  /v1/wallets/{walletId}/accounts:
    parameters:
      - { name: walletId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [wallets]
      operationId: createAccount
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hdIndex, name]
              properties:
                hdIndex: { type: integer, minimum: 0, maximum: 2147483647 }
                name: { type: string, maxLength: 64 }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Account" } } } }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/accounts/{accountId}:
    parameters:
      - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [wallets]
      operationId: updateAccount
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 64 }
                hidden: { type: boolean }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Account" } } } }
  /v1/accounts/{accountId}/addresses:
    parameters:
      - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [wallets]
      operationId: registerAddress
      description: |
        Registers a public EVM address for history/notifications. `proof` is an
        EIP-191 personal_sign signature (0x-hex, 65 bytes) over the exact message
        `QDWallet-Address|v1|{accountId}|{address-lowercase}|{userId}`.
        Monero addresses are never registered (ADR-006).
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [networkFamily, address, proof]
              properties:
                networkFamily: { type: string, enum: [evm] }
                address: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
                proof: { type: string, pattern: "^0x[0-9a-fA-F]{130}$" }
      responses:
        "200": { description: Registered, content: { application/json: { schema: { $ref: "#/components/schemas/Address" } } } }
        "400": { $ref: "#/components/responses/Problem" }
  /v1/accounts/{accountId}/activity:
    parameters:
      - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: network, in: query, required: true, schema: { type: string } }
      - { name: cursor, in: query, schema: { type: string } }
      - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
    get:
      tags: [transactions]
      operationId: accountActivity
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Page of activity for the account's registered addresses
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ActivityItem" } }
                  nextCursor: { type: string }

  /v1/rpc/evm/{chainId}:
    parameters:
      - { name: chainId, in: path, required: true, schema: { type: integer } }
    post:
      tags: [chain]
      operationId: evmRpc
      description: |
        JSON-RPC 2.0 proxy. Single or batch (max 20). Only allowlisted methods
        (spec §25.3); others return JSON-RPC error -32601. `eth_getLogs` ranges are
        capped at 2000 blocks. Provider credentials are never exposed.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: {}
      responses:
        "200": { description: JSON-RPC response(s), content: { application/json: { schema: {} } } }
        "404": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }

  /v1/transactions:
    post:
      tags: [transactions]
      operationId: trackTransaction
      description: Registers a client-broadcast transaction for status tracking.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [networkId, hash, accountId, from, to, assetId, amount]
              properties:
                networkId: { type: string }
                hash: { type: string, pattern: "^0x[0-9a-fA-F]{64}$" }
                accountId: { type: string, format: uuid }
                from: { type: string }
                to: { type: string }
                assetId: { type: string }
                amount: { type: string, pattern: "^[0-9]{1,78}$" }
                nonce: { type: integer }
      responses:
        "201": { description: Tracking, content: { application/json: { schema: { $ref: "#/components/schemas/Transaction" } } } }
  /v1/transactions/{transactionId}:
    parameters:
      - { name: transactionId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [transactions]
      operationId: getTransaction
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200": { description: Transaction, content: { application/json: { schema: { $ref: "#/components/schemas/Transaction" } } } }
        "404": { $ref: "#/components/responses/Problem" }

  /v1/security/events:
    get:
      tags: [security]
      operationId: listSecurityEvents
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Security events, newest first
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events: { type: array, items: { $ref: "#/components/schemas/SecurityEvent" } }
  /v1/security/client-events:
    post:
      tags: [security]
      operationId: reportClientEvent
      description: Client-reported security events. Allowlisted types only; no free text.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  enum: [phrase_revealed, unlock_failed_burst, wallet_created, wallet_imported, wallet_wiped, backup_verified]
      responses:
        "202": { description: Accepted }

  /v1/networks:
    get:
      tags: [public]
      operationId: listNetworks
      responses:
        "200":
          description: Networks enabled on this server
          content:
            application/json:
              schema:
                type: object
                required: [networks]
                properties:
                  networks: { type: array, items: { $ref: "#/components/schemas/Network" } }
  /v1/relayers:
    get:
      tags: [public]
      operationId: relayerStatus
      description: |
        Shared-wallet relayer diagnostics per chain with an RPC upstream or a relayer key: RPC reachability and
        chain id, relayer address and balance, deterministic deployer and QD contract deployment, and the Gas
        Service Account funding view (gas prices, health, pending requirement, capacity). Cached for 10 s;
        `refresh=1` (the UI's "Refresh balance") accepts a result up to 3 s old. Public data only; never key material.
      parameters:
        - { name: refresh, in: query, required: false, schema: { type: string, enum: ["1"] } }
      responses:
        "200":
          description: Relayer status per chain
          content:
            application/json:
              schema:
                type: object
                required: [chains]
                properties:
                  chains: { type: array, items: { $ref: "#/components/schemas/RelayerChainStatus" } }
  /v1/prices:
    get:
      tags: [public]
      operationId: getPrices
      parameters:
        - { name: ids, in: query, required: true, schema: { type: string }, description: "comma-separated priceRef ids (max 50)" }
      responses:
        "200":
          description: USD prices
          content:
            application/json:
              schema:
                type: object
                required: [prices]
                properties:
                  prices:
                    type: object
                    additionalProperties: { type: object, required: [usd], properties: { usd: { type: string } } }
                  updatedAt: { type: string, format: date-time }
  /healthz:
    get: { tags: [public], operationId: healthz, responses: { "200": { description: Alive } } }
  /readyz:
    get: { tags: [public], operationId: readyz, responses: { "200": { description: Ready }, "503": { description: Not ready } } }

  /v1/shared-wallets:
    get:
      tags: [shared-wallets]
      operationId: listSharedWallets
      description: Shared wallets in which the caller is an active participant.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { wallets: { type: array, items: { $ref: "#/components/schemas/SharedWallet" } } } } } } }
    post:
      tags: [shared-wallets]
      operationId: createSharedWallet
      description: Creates a shared wallet with the caller as owner participant, bound to the calling device key. Default policy is ceil(N/2).
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 64 }
                displayName: { type: string, maxLength: 64 }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/SharedWallet" } } } }
  /v1/shared-wallets/{walletId}:
    parameters:
      - { name: walletId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [shared-wallets]
      operationId: getSharedWallet
      description: Participants, policy, accounts; invitations for the owner only. 404 for non-participants.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SharedWallet" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/shared-wallets/{walletId}/authorization-policy:
    parameters:
      - { name: walletId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [shared-wallets]
      operationId: getAuthorizationPolicy
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AuthorizationPolicy" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/shared-wallets/{walletId}/invitations:
    parameters:
      - { name: walletId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [shared-wallets]
      operationId: createInvitation
      description: Owner only. Returns a one-time code exactly once; the server stores only its SHA-256. Expires after 72 h.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: []
              properties:
                label: { type: string, maxLength: 64 }
      responses:
        "201": { description: Created, content: { application/json: { schema: { type: object, properties: { id: { type: string, format: uuid }, code: { type: string }, label: { type: string }, status: { type: string }, expiresAt: { type: string, format: date-time } } } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/shared-wallets/{walletId}/invitations/{invitationId}/revoke:
    parameters:
      - { name: walletId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: invitationId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [shared-wallets]
      operationId: revokeInvitation
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "204": { description: Revoked }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/shared-wallets/{walletId}/participants/{participantId}/revoke:
    parameters:
      - { name: walletId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: participantId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [shared-wallets]
      operationId: revokeParticipant
      description: Owner revokes a member, or a member leaves. Bumps membershipVersion, supersedes open proposals and sets keyStatus to rekey_required if a key was active.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200": { description: Revoked, content: { application/json: { schema: { type: object, properties: { membershipVersion: { type: integer }, keyStatus: { type: string } } } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/shared-wallets/{walletId}/accounts:
    parameters:
      - { name: walletId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [shared-wallets]
      operationId: createSharedAccount
      description: Adds a QD account (next derivation index). Does not create a participant. No Ethereum address exists until a Raccoon verifier is deployed.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/SharedAccount" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/shared-wallets/{walletId}/proposals:
    parameters:
      - { name: walletId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [shared-wallets]
      operationId: listProposals
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { proposals: { type: array, items: { $ref: "#/components/schemas/Proposal" } } } } } } }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      tags: [shared-wallets]
      operationId: createProposal
      description: |
        Creates an immutable proposal with a frozen policy and participant snapshot.
        digest = SHA-256 of the canonical string documented in docs/architecture/shared-wallet-authorization.md.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [accountId, chainId, to, valueWei, nonce, gasLimit, maxFeePerGas, maxPriorityFeePerGas]
              properties:
                accountId: { type: string, format: uuid }
                chainId: { type: integer, minimum: 1 }
                to: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
                valueWei: { type: string, pattern: "^(0|[1-9][0-9]{0,77})$" }
                data: { type: string, pattern: "^0x([0-9a-fA-F]{2})*$" }
                nonce: { type: integer, minimum: 0 }
                gasLimit: { type: integer, minimum: 1, maximum: 30000000 }
                maxFeePerGas: { type: string }
                maxPriorityFeePerGas: { type: string }
                ttlSeconds: { type: integer, minimum: 300, maximum: 604800 }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Proposal" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/shared-wallet-invitations/preview:
    post:
      tags: [shared-wallets]
      operationId: previewInvitation
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { walletId: { type: string }, walletName: { type: string }, invitedBy: { type: string }, activeParticipants: { type: integer }, expiresAt: { type: string } } } } } }
        "400": { $ref: "#/components/responses/Problem" }
  /v1/shared-wallet-invitations/accept:
    post:
      tags: [shared-wallets]
      operationId: acceptInvitation
      description: Joins as a participant bound to the calling user and device key (taken from the session, never the body).
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string }
                displayName: { type: string, maxLength: 64 }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SharedWallet" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/shared-wallet-invitations/reject:
    post:
      tags: [shared-wallets]
      operationId: rejectInvitation
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string }
      responses:
        "204": { description: Rejected }
        "400": { $ref: "#/components/responses/Problem" }
  /v1/proposals/{proposalId}:
    parameters:
      - { name: proposalId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [shared-wallets]
      operationId: getProposal
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Proposal" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/shared-wallets/{walletId}/history:
    parameters:
      - { name: walletId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: chainId, in: query, required: true, schema: { type: integer } }
    get:
      tags: [shared-wallets]
      operationId: sharedWalletHistory
      description: |
        Wallet History: every transfer from or to this wallet's smart accounts on one chain, from the chain index
        (receipts and logs; never proposals or client state), newest first. Includes incoming transfers, ERC-20
        transfers, executions whose call reverted (`kind: qd_execute`, `success: false`) and reverted outer
        transactions. Executions are linked to their proposal. Members only; the addresses are indexed on request.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [chainId, network, addresses, items, coverage, index]
                properties:
                  chainId: { type: integer }
                  network: { type: string }
                  addresses: { type: array, items: { type: string }, description: "always an array (empty before an account address exists)" }
                  index:
                    type: object
                    required: [state]
                    description: Whether the chain could be read for this request; stored history is returned in every state.
                    properties:
                      state: { type: string, enum: [ok, indexing, rpc_unavailable, rpc_error, disabled] }
                      error: { type: string, description: "rpc_error only; RPC URLs removed" }
                  items: { type: array, items: { $ref: "#/components/schemas/WalletHistoryItem" } }
                  coverage:
                    type: object
                    additionalProperties: { type: object, properties: { sinceBlock: { type: integer }, scannedThroughBlock: { type: integer } } }
        "400": { description: "INVALID_QUERY (chainId missing or not a positive integer) or UNSUPPORTED_NETWORK (not served by this API)", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "404": { description: "NOT_FOUND: unknown wallet, malformed wallet id, or the caller is not a participant", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
  /v1/proposals/{proposalId}/gas-estimate:
    parameters:
      - { name: proposalId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [shared-wallets]
      operationId: proposalGasEstimate
      description: |
        What executing the proposal requires now, from the relayer's own preflight against the chain: remaining
        one-time setup, gas upper bound, the gas service (relayer) and shared-account balances, shortfalls and
        whether execution can proceed. Read-only: sends nothing and never changes the approved transaction.
        Members of the proposal's wallet only.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/GasEstimate" } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/gas-service/{chainId}/history:
    parameters:
      - { name: chainId, in: path, required: true, schema: { type: integer } }
      - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 1000, default: 200 } }
    get:
      tags: [shared-wallets]
      operationId: gasServiceHistory
      description: |
        The chain's gas service account history, newest first, from chain receipts: incoming recharges and outgoing
        gas payments (one-time setup, executions). `proposalId` is included only for proposals of wallets the caller
        belongs to. Recharges are found by bisecting the account's historical balance and nonce from
        `historyAvailableSinceBlock` (needs an archive-capable RPC; otherwise history starts when the API started).
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [chainId, address, transfers]
                properties:
                  chainId: { type: integer }
                  address: { type: string }
                  scannedThroughBlock: { type: integer, nullable: true }
                  historyAvailableSinceBlock: { type: integer, nullable: true }
                  transfers: { type: array, items: { $ref: "#/components/schemas/GasTransfer" } }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/proposals/{proposalId}/vote-nonce:
    parameters:
      - { name: proposalId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [shared-wallets]
      operationId: issueVoteNonce
      description: Single-use nonce bound to this participant and proposal, valid 2 minutes.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "201": { description: Created, content: { application/json: { schema: { type: object, properties: { nonce: { type: string }, participantId: { type: string, format: uuid }, expiresAt: { type: string } } } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/proposals/{proposalId}/votes:
    parameters:
      - { name: proposalId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [shared-wallets]
      operationId: castVote
      description: |
        Approve or reject. `signature` is IEEE P1363 P-256 (base64url) by the participant's registered device key over
        `QDWallet-Vote|v1|{decision}|{proposalId}|{walletId}|{digestHex}|{policyVersion}|{membershipVersion}|{participantId}|{nonce}|{issuedAt}`.
        Counting and the threshold transition are atomic; the signing job is created exactly once.
        Errors: VOTE_NONCE_INVALID, VOTE_SIGNATURE_INVALID, DIGEST_MISMATCH, DUPLICATE_VOTE, PROPOSAL_CLOSED, NOT_ELIGIBLE, WRONG_DEVICE.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision, nonce, issuedAt, digest, signature]
              properties:
                decision: { type: string, enum: [approve, reject] }
                nonce: { type: string }
                issuedAt: { type: integer, description: Unix seconds, within 5 minutes of server time }
                digest: { type: string, pattern: "^[0-9a-f]{64}$" }
                signature: { type: string }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Proposal" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/shared-wallets/{walletId}/accounts/{accountId}/key:
    parameters:
      - { name: walletId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [shared-wallets]
      operationId: registerAccountKey
      description: |
        Register (or attest) the account's Raccoon public key pk_j (5152 bytes, base64url), derived by the caller's key worker from
        its share. The QdAccount address is CREATE2(factory, keccak256("QD-VK-v1" ‖ pk_j)). `signature` (P-256, bound device) is over
        `QDWallet-AccountKey|v1|{walletId}|{accountId}|{derivationIndex}|{keygenId}|{publicKeyHashHex}|{address}`.
        A different key than the one registered is refused (ACCOUNT_KEY_MISMATCH) and audited.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [publicKey, signature]
              properties: { publicKey: { type: string }, signature: { type: string } }
      responses:
        "200": { description: Account key with attestations }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    get:
      tags: [shared-wallets]
      operationId: getAccountKey
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200": { description: "Account key including publicKey (base64url)" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/proposals/{proposalId}/signing-sessions:
    parameters:
      - { name: proposalId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [shared-wallets]
      operationId: startSigning
      description: |
        Selected signers only (bound device). Opens the proposal's signing session with a fresh random 32-byte sid, or returns the
        open (or completed) one. Errors: NOT_SELECTED_SIGNER, SIGNING_NOT_READY, SIGNING_ATTEMPTS_EXHAUSTED, PROPOSAL_EXPIRES_TOO_SOON, PROPOSAL_CLOSED.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SigningSession" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/signing-sessions/{sessionId}:
    parameters:
      - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [shared-wallets]
      operationId: getSigningSession
      description: Wallet participants only. Payloads of the previous round are included (all rounds with ?payloads=all). Cache-Control no-store.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: payloads, in: query, required: false, schema: { type: string, enum: [all] } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SigningSession" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/signing-sessions/{sessionId}/rounds/{round}:
    parameters:
      - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: round, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 3 } }
    post:
      tags: [shared-wallets]
      operationId: submitSigningRound
      description: |
        One selected signer's message for the current round (fixed-size encodings from qd-crypto). `signature` (P-256, bound device) is over
        `QDWallet-SignRound|v1|{sessionId}|{round}|{partyIndex}|{participantId}|{transcriptHash}|{sha256(payload)}`, where transcriptHash
        = SHA-256 of the session header and every earlier round message. Round-2 openings are checked against round-1 commitments; after
        round 3 the coordinator combines and verifies the signature. Errors: SIGNING_SESSION_CLOSED, DUPLICATE_ROUND_MESSAGE,
        TRANSCRIPT_MISMATCH, ROUND_MESSAGE_INVALID, NOT_SELECTED_SIGNER, SIGNATURE_INVALID, WRONG_DEVICE.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [payload, transcriptHash, signature]
              properties: { payload: { type: string }, transcriptHash: { type: string, pattern: "^[0-9a-f]{64}$" }, signature: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SigningSession" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/signing-sessions/{sessionId}/abort:
    parameters:
      - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [shared-wallets]
      operationId: abortSigning
      description: "A selected signer ends a session it cannot complete. signature over QDWallet-SignAbort|v1|{sessionId}|{participantId}|{reason}."
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason, signature]
              properties: { reason: { type: string, enum: [cancelled, participant_abort, signer_state_lost] }, signature: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SigningSession" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/shared-wallets/{walletId}/key-generations:
    parameters:
      - { name: walletId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [shared-wallets]
      operationId: startKeyGeneration
      description: |
        Owner only, from their bound device, which becomes the trusted dealer. Freezes the active participants (party
        indices 1..N in join order), T = ceil(N × policy) and the membership version. Any join or revocation fails it.
        Errors: FORBIDDEN, WRONG_DEVICE, KEYGEN_IN_PROGRESS, KEY_ALREADY_INITIALIZED.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/KeyGeneration" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/shared-wallets/{walletId}/key-generations/current:
    parameters:
      - { name: walletId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [shared-wallets]
      operationId: currentKeyGeneration
      description: Newest ceremony (an expired open ceremony is failed on read). Never contains envelopes.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/KeyGeneration" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/shared-wallets/{walletId}/key-generations/{keygenId}/encryption-key:
    parameters:
      - { name: walletId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: keygenId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [shared-wallets]
      operationId: registerEncryptionKey
      description: |
        Registers this participant's per-ceremony X-Wing public key (1216 bytes, base64url), once. `signature` is P1363
        P-256 by the bound device over `QDWallet-KeygenKey|v1|{walletId}|{keygenId}|{participantId}|{partyIndex}|{membershipVersion}|{sha256Hex(publicKey)}`.
        The last registration moves the ceremony to `dealing`. Errors: SIGNATURE_INVALID, ALREADY_REGISTERED, KEYGEN_NOT_OPEN, WRONG_DEVICE.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [publicKey, signature]
              properties:
                publicKey: { type: string }
                signature: { type: string }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/KeyGeneration" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/shared-wallets/{walletId}/key-generations/{keygenId}/envelopes/{participantId}:
    parameters:
      - { name: walletId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: keygenId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: participantId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [shared-wallets]
      operationId: stageEnvelope
      description: |
        Dealer only, while `dealing`. One opaque HPKE envelope (X-Wing / HKDF-SHA256 / AES-256-GCM) per request:
        `enc` is 1120 bytes, `ct` at most 40 KiB (base64url). Replaces a previously staged envelope until committed.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [fingerprint, enc, ct]
              properties:
                fingerprint: { type: string, pattern: "^[0-9a-f]{64}$" }
                enc: { type: string }
                ct: { type: string }
      responses:
        "204": { description: Staged }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/shared-wallets/{walletId}/key-generations/{keygenId}/commit:
    parameters:
      - { name: walletId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: keygenId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [shared-wallets]
      operationId: commitDeal
      description: |
        Dealer only. Requires one staged envelope per party, all under `fingerprint`. `signature` is by the dealer device over
        `QDWallet-KeygenDeal|v1|{walletId}|{keygenId}|{membershipVersion}|{T}|{N}|{fingerprint}|{envelopesDigest}`, where
        envelopesDigest = SHA-256 of `{partyIndex}:{participantId}:{sha256Hex(enc‖ct)}` lines ordered by index and joined by `;`.
        Errors: KEYGEN_INCOMPLETE, SIGNATURE_INVALID, KEYGEN_NOT_OPEN.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [fingerprint, signature]
              properties:
                fingerprint: { type: string, pattern: "^[0-9a-f]{64}$" }
                signature: { type: string }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/KeyGeneration" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/shared-wallets/{walletId}/key-generations/{keygenId}/envelope:
    parameters:
      - { name: walletId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: keygenId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [shared-wallets]
      operationId: myKeygenEnvelope
      description: "The caller's own envelope only, from its bound device, until acknowledged. Errors ALREADY_PROVISIONED, KEYGEN_NOT_OPEN, WRONG_DEVICE."
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  walletId: { type: string, format: uuid }
                  keygenId: { type: string, format: uuid }
                  participantId: { type: string, format: uuid }
                  partyIndex: { type: integer }
                  threshold: { type: integer }
                  parties: { type: integer }
                  membershipVersion: { type: integer }
                  fingerprint: { type: string }
                  enc: { type: string }
                  ct: { type: string }
                  envelopeHash: { type: string }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/shared-wallets/{walletId}/key-generations/{keygenId}/acknowledge:
    parameters:
      - { name: walletId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: keygenId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [shared-wallets]
      operationId: acknowledgeShare
      description: |
        Sent after the device decrypted, verified and stored its share. `signature` over
        `QDWallet-KeygenAck|v1|{walletId}|{keygenId}|{participantId}|{partyIndex}|{T}|{N}|{membershipVersion}|{fingerprint}|{sha256Hex(enc‖ct)}`.
        Deletes the envelope. The N-th acknowledgement completes the ceremony and activates the wallet key atomically.
        Errors: FINGERPRINT_MISMATCH, SIGNATURE_INVALID, ALREADY_PROVISIONED, KEYGEN_NOT_OPEN.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [fingerprint, signature]
              properties:
                fingerprint: { type: string, pattern: "^[0-9a-f]{64}$" }
                signature: { type: string }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/KeyGeneration" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/shared-wallets/{walletId}/key-generations/{keygenId}/fail:
    parameters:
      - { name: walletId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: keygenId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [shared-wallets]
      operationId: failKeyGeneration
      description: "A party reports `decryption_failed` or `share_verification_failed`; the dealer may cancel (`cancelled`). Wipes all envelopes."
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, enum: [cancelled, decryption_failed, share_verification_failed] }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/KeyGeneration" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: __Host-qd_at }
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    ClientType:
      name: X-QD-Client
      in: header
      required: true
      schema: { type: string, enum: [web, mobile] }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 128 }
  responses:
    Problem:
      description: Problem details
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    SigningSession:
      type: object
      description: "Public signing transcript state. Never contains a key share."
      properties:
        id: { type: string, format: uuid }
        attempt: { type: integer }
        status: { type: string, enum: [round1, round2, round3, combining, complete, failed] }
        round: { type: integer }
        failureReason: { type: string }
        signerPartyIndexes: { type: array, items: { type: integer } }
        signerParticipantIds: { type: array, items: { type: string, format: uuid } }
        sid: { type: string }
        message: { type: string, description: QdAccount execution message (0x hex) }
        accountAddress: { type: string }
        publicKeyHash: { type: string }
        header: { type: string }
        transcriptHash: { type: string }
        progress: { type: object }
        messages: { type: array, items: { type: object } }
        signature: { type: string, description: "base64url, 19494 bytes; present once combined and verified" }
        signatureVerified: { type: boolean }
        execution: { $ref: "#/components/schemas/Execution" }
    Execution:
      type: object
      properties:
        status: { type: string, enum: [not_started, pending, submitting, submitted, confirmed, failed] }
        chainId: { type: integer }
        accountAddress: { type: string }
        lastError: { type: string }
        relayer: { type: string }
        txHash: { type: string }
        blockNumber: { type: integer }
        gasUsed: { type: integer }
        callSuccess: { type: boolean }
        stage:
          type: string
          description: What the relayer is doing or waiting for.
          enum: [queued, checking_relayer, relayer_unavailable, insufficient_account_funds, insufficient_relayer_funds,
                 setting_up_verifier, preparing_account, waiting_nonce, submitting, submitted, confirmed, failed, expired]
        setupTxs: { type: array, items: { type: string }, description: One-time setup transactions mined successfully, in order }
        setupAttempts: { type: integer, description: Setup transactions that were mined and reverted (max 3, 5 minutes apart) }
        pendingSetupTx: { type: string }
        nextAttemptAt: { type: string, format: date-time }
        txNonce: { type: integer, description: Relayer transaction nonce of the execute transaction }
        effectiveGasPrice: { type: string, description: wei, decimal, from the receipt }
        blockTime: { type: string, format: date-time, description: Block timestamp }
        executedTo: { type: string, description: From QdAccount.Executed }
        executedValue: { type: string, description: wei, decimal, from QdAccount.Executed }
    RelayerChainStatus:
      type: object
      description: Relayer diagnostics for one chain. Never contains key material.
      properties:
        chainId: { type: integer }
        rpcConfigured: { type: boolean }
        rpcOk: { type: boolean }
        rpcChainId: { type: integer }
        relayerConfigured: { type: boolean }
        relayerAddress: { type: string }
        relayerBalanceWei: { type: string }
        deployerPresent: { type: boolean }
        verifierAddress: { type: string }
        verifierDeployed: { type: boolean }
        factoryAddress: { type: string }
        factoryDeployed: { type: boolean }
        ready: { type: boolean }
        problems: { type: array, items: { type: string } }
        blockNumber: { type: integer }
        baseFeeWei: { type: string }
        tipWei: { type: string }
        gasPriceWei: { type: string, description: "base fee + tip: what a transaction pays per gas now" }
        feeCapWei: { type: string, description: "fee cap the relayer signs with (3 × base fee + tip)" }
        executionCostWei: { type: string, description: "upper bound for one execution of an already set-up wallet key" }
        newWalletCostWei: { type: string, description: "upper bound for a new wallet key's one-time setup plus one execution" }
        pendingOperations: { type: integer }
        pendingRequiredWei: { type: string, description: "upper bound the relayer still has to pay for waiting executions" }
        lowBalanceWei: { type: string, description: "GAS_LOW_BALANCE_WEI_<chainId>, or newWalletCostWei by default" }
        lowBalanceConfigured: { type: boolean }
        shortfallWei: { type: string }
        executionsCovered: { type: integer }
        health: { type: string, enum: [healthy, low, insufficient, unknown] }
        healthMessage: { type: string }
        checkedAt: { type: string, format: date-time }
        scannedThroughBlock: { type: integer }
        historyAvailableSinceBlock: { type: integer }
    WalletHistoryItem:
      type: object
      required: [txHash, logIndex, kind, direction, from, to, token, amount, success, blockNumber, blockTime]
      properties:
        txHash: { type: string, description: "\"internal:<block>:<address>\" for value received without a decodable transaction" }
        logIndex: { type: integer, description: "-1 the transaction's own value; -2 internal; >= 0 the Executed, ERC-20 or EIP-7708 log" }
        kind: { type: string, enum: [native, qd_execute, erc20, internal] }
        direction: { type: string, enum: [sent, received, self] }
        from: { type: string }
        to: { type: string }
        token: { type: string, description: "empty for the native coin" }
        amount: { type: string, description: base units }
        success: { type: boolean, description: "receipt status 1 and, for qd_execute, Executed.success" }
        status: { type: string, enum: [confirmed, failed] }
        explorerUrl: { type: string, description: "block explorer page (absent for local chains and internal transfers)" }
        txFrom: { type: string, description: "who sent the transaction and paid gas" }
        txTo: { type: string }
        blockNumber: { type: integer }
        blockTime: { type: string, format: date-time }
        gasUsed: { type: integer }
        gasPriceWei: { type: string }
        feeWei: { type: string }
        proposalId: { type: string, format: uuid }
    GasEstimate:
      type: object
      required: [chainId, checkedAt, rpcOk, relayerConfigured, relayerBalanceWei, accountAddress, accountDeployed, accountBalanceWei, transferWei, setupSteps, gasUnits, canProceed]
      properties:
        chainId: { type: integer }
        checkedAt: { type: string, format: date-time }
        rpcOk: { type: boolean }
        relayerConfigured: { type: boolean }
        relayerAddress: { type: string }
        relayerBalanceWei: { type: string, nullable: true, description: "null: unavailable (not zero)" }
        accountAddress: { type: string }
        accountDeployed: { type: boolean, nullable: true }
        accountBalanceWei: { type: string, nullable: true }
        transferWei: { type: string }
        setupSteps: { type: array, items: { type: string } }
        gasUnits: { type: integer, description: "upper bound including 20 % gas-limit headroom" }
        baseFeeWei: { type: string }
        gasPriceWei: { type: string }
        feeCapWei: { type: string }
        requiredRelayerWei: { type: string, description: "gasUnits × fee cap: what the gas service account must hold" }
        estimatedFeeWei: { type: string, description: "gasUnits × current gas price" }
        relayerShortfallWei: { type: string }
        accountShortfallWei: { type: string }
        canProceed: { type: boolean }
        blocker: { type: string }
    GasTransfer:
      type: object
      required: [txHash, direction, kind, valueWei, success, blockNumber, blockTime]
      properties:
        txHash: { type: string, description: "\"internal:<block>\" for a balance increase without a direct transaction" }
        direction: { type: string, enum: [in, out] }
        kind: { type: string, enum: [recharge, recharge_internal, setup, execute, other] }
        counterparty: { type: string }
        valueWei: { type: string }
        gasUsed: { type: integer }
        gasPriceWei: { type: string }
        feeWei: { type: string }
        success: { type: boolean }
        blockNumber: { type: integer }
        blockTime: { type: string, format: date-time }
        proposalId: { type: string, format: uuid }
    Problem:
      type: object
      required: [title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        requestId: { type: string }
    Challenge:
      type: object
      required: [challengeId, nonce, message, expiresAt]
      properties:
        challengeId: { type: string }
        nonce: { type: string }
        message: { type: string }
        expiresAt: { type: string, format: date-time }
    Session:
      type: object
      required: [userId, deviceId, accessExpiresAt]
      properties:
        userId: { type: string, format: uuid }
        deviceId: { type: string, format: uuid }
        accessExpiresAt: { type: string, format: date-time }
        csrfToken: { type: string, description: web only }
        accessToken: { type: string, description: mobile only }
        refreshToken: { type: string, description: mobile only }
    Device:
      type: object
      required: [id, platform, label, createdAt, lastSeenAt, current]
      properties:
        id: { type: string, format: uuid }
        platform: { type: string, enum: [web, ios, android] }
        label: { type: string }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time }
        current: { type: boolean }
    Wallet:
      type: object
      required: [id, label, defaultSigningMode, accounts, createdAt]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        defaultSigningMode: { type: string, enum: [hd, mpc, qd] }
        accounts: { type: array, items: { $ref: "#/components/schemas/Account" } }
        createdAt: { type: string, format: date-time }
    Account:
      type: object
      required: [id, walletId, name, signingMode, hidden, addresses]
      properties:
        id: { type: string, format: uuid }
        walletId: { type: string, format: uuid }
        hdIndex: { type: integer }
        name: { type: string }
        signingMode: { type: string, enum: [hd, mpc, qd] }
        hidden: { type: boolean }
        addresses: { type: array, items: { $ref: "#/components/schemas/Address" } }
    Address:
      type: object
      required: [id, networkFamily, address]
      properties:
        id: { type: string, format: uuid }
        networkFamily: { type: string, enum: [evm] }
        address: { type: string }
    Network:
      type: object
      required: [id, family, name, kind, nativeSymbol, nativeDecimals]
      properties:
        id: { type: string }
        family: { type: string, enum: [evm, monero] }
        chainId: { type: integer }
        name: { type: string }
        kind: { type: string, enum: [mainnet, testnet, local, unknown] }
        nativeSymbol: { type: string }
        nativeDecimals: { type: integer }
    Transaction:
      type: object
      required: [id, networkId, hash, from, to, assetId, amount, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        networkId: { type: string }
        hash: { type: string }
        from: { type: string }
        to: { type: string }
        assetId: { type: string }
        amount: { type: string }
        fee: { type: string }
        nonce: { type: integer }
        status: { type: string, enum: [pending, confirmed, failed, replaced, dropped] }
        blockNumber: { type: integer }
        createdAt: { type: string, format: date-time }
        events:
          type: array
          items:
            type: object
            required: [toStatus, observedAt]
            properties:
              fromStatus: { type: string }
              toStatus: { type: string }
              observedAt: { type: string, format: date-time }
    ActivityItem:
      type: object
      required: [hash, networkId, direction, from, to, assetId, amount, status, timestamp, flags]
      properties:
        hash: { type: string }
        networkId: { type: string }
        direction: { type: string, enum: [in, out, self] }
        from: { type: string }
        to: { type: string }
        assetId: { type: string }
        amount: { type: string }
        fee: { type: string }
        status: { type: string, enum: [pending, confirmed, failed, replaced, dropped] }
        blockNumber: { type: integer }
        timestamp: { type: string, format: date-time }
        flags: { type: array, items: { type: string, enum: [suspected_poisoning] } }
    SecurityEvent:
      type: object
      required: [id, type, severity, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        severity: { type: string, enum: [info, warning, critical] }
        deviceId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        metadata: { type: object }
    AuthorizationPolicy:
      type: object
      properties:
        version: { type: integer }
        numerator: { type: integer }
        denominator: { type: integer }
        rounding: { type: string, enum: [ceil] }
        membershipVersion: { type: integer }
        activeParticipants: { type: integer }
        requiredApprovals: { type: integer, description: "ceil(activeParticipants * numerator / denominator)" }
        maxParticipants: { type: integer, description: Threshold Raccoon party limit (64) }
    SharedParticipant:
      type: object
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        role: { type: string, enum: [owner, member] }
        status: { type: string, enum: [active, suspended, revoked] }
        joinedAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time }
    SharedAccount:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        derivationIndex: { type: integer }
        address: { type: "null", description: No Ethereum address until an on-chain Raccoon verifier exists }
        createdAt: { type: string, format: date-time }
    KeyGenerationSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [collecting_keys, dealing, awaiting_provisioning, complete, failed] }
        failureReason: { type: string }
        threshold: { type: integer }
        parties: { type: integer }
        membershipVersion: { type: integer }
        dealerParticipantId: { type: string, format: uuid }
        fingerprint: { type: [string, "null"], description: SHA3-256 master-key fingerprint (hex), set when envelopes are committed }
        keysRegistered: { type: integer }
        provisioned: { type: integer }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
    KeyGeneration:
      allOf:
        - { $ref: "#/components/schemas/KeyGenerationSummary" }
        - type: object
          properties:
            participants:
              type: array
              items:
                type: object
                properties:
                  participantId: { type: string, format: uuid }
                  partyIndex: { type: integer }
                  encryptionKey: { type: [string, "null"], description: base64url X-Wing public key }
                  keyRegistered: { type: boolean }
                  envelopeStaged: { type: boolean }
                  provisioned: { type: boolean }
            me: { type: [object, "null"], properties: { participantId: { type: string }, partyIndex: { type: integer } } }
    SharedWallet:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        keyStatus: { type: string, enum: [none, rekey_required, active] }
        key:
          type: object
          properties:
            status: { type: string, enum: [not_initialized, in_progress, awaiting_provisioning, initialized, failed, rekey_required] }
            generation: { $ref: "#/components/schemas/KeyGenerationSummary" }
            keyGenerationId: { type: string, format: uuid }
            fingerprint: { type: string }
        policy: { $ref: "#/components/schemas/AuthorizationPolicy" }
        me: { $ref: "#/components/schemas/SharedParticipant" }
        participants: { type: array, items: { $ref: "#/components/schemas/SharedParticipant" } }
        accounts: { type: array, items: { $ref: "#/components/schemas/SharedAccount" } }
        invitations: { type: array, description: Owner only, items: { type: object } }
        createdAt: { type: string, format: date-time }
    Proposal:
      type: object
      description: Immutable after creation except status. Snapshot fields are frozen at creation.
      properties:
        id: { type: string, format: uuid }
        walletId: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        derivationIndex: { type: integer }
        initiatorParticipantId: { type: string, format: uuid }
        senderAddress: { type: [string, "null"], description: "QdAccount address of the sender account once its key is registered" }
        chainId: { type: integer }
        to: { type: string }
        valueWei: { type: string }
        data: { type: string }
        nonce: { type: integer }
        gasLimit: { type: integer }
        maxFeePerGas: { type: string }
        maxPriorityFeePerGas: { type: string }
        policy: { type: object }
        membershipVersion: { type: integer }
        participantCount: { type: integer }
        requiredApprovals: { type: integer }
        eligibleParticipantIds: { type: array, items: { type: string, format: uuid } }
        digest: { type: string, description: SHA-256 hex of the canonical proposal string }
        status: { type: string, enum: [pending, approved, rejected, expired, superseded] }
        approvals: { type: integer }
        rejections: { type: integer }
        remainingApprovals: { type: integer }
        votes: { type: array, items: { type: object } }
        myVote: { type: string, enum: [approve, reject] }
        lifecycle:
          type: string
          enum: [awaiting_approvals, threshold_reached, awaiting_key_generation, awaiting_account_key, awaiting_signers, signing, signing_failed,
                 signature_verified, checking_relayer, relayer_unavailable, insufficient_account_funds, insufficient_relayer_funds,
                 setting_up_verifier, preparing_account, waiting_nonce, submitting, submitted, confirmed, execution_failed,
                 rejected, expired, superseded]
          description: "Single honest status from approval to chain; confirmed only after a receipt with status 1 and a matching Executed(success = true) event."
        signing: { type: object, description: "Present once approved: selected signers, their party indexes and the latest signing session summary (status round1|round2|round3|combining|complete|failed, per-round progress)." }
        execution: { $ref: "#/components/schemas/Execution" }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
